# Reverse proxy for the containerised portfolio. Terminate TLS here (certbot or your provider),
# then forward to the Next.js standalone server on port 3000.
upstream portfolio {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name thuyakyaw.com www.thuyakyaw.com;
  return 301 https://thuyakyaw.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name thuyakyaw.com;

  ssl_certificate     /etc/letsencrypt/live/thuyakyaw.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/thuyakyaw.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Hashed build assets are immutable.
  location /_next/static/ {
    proxy_pass http://portfolio;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://portfolio;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
